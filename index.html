<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ محمد رجب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .admin-card {
            max-width: 800px;
            margin: auto;
        }
        h2, h3 {
            color: #1a73e8;
            margin-bottom: 24px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        #errorMessage {
            color: #d93025;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول -->
    <div class="card login-card" id="loginSection">
        <h2>منصة الأستاذ محمد رجب 🎓</h2>
        <div class="input-group">
            <label for="userCode">كود المستخدم</label>
            <input type="text" id="userCode" placeholder="أدخل الكود الخاص بك (مثال: 1411)" required>
        </div>
        <div class="input-group">
            <label for="userPass">كلمة المرور</label>
            <input type="password" id="userPass" placeholder="أدخل كلمة المرور" required>
        </div>
        <button id="loginBtn">تسجيل الدخول</button>
        <div id="errorMessage">كود المستخدم أو كلمة المرور غير صحيحة.</div>
    </div>

    <!-- لوحة تحكم المدير (مخفية في البداية) -->
    <div class="card admin-card" id="adminDashboard" style="display: none;">
        <h2>مرحباً بك يا أستاذ محمد 👨‍🏫 - لوحة الإدارة</h2>
        
        <div style="border-top: 2px solid #f0f2f5; padding-top: 20px; margin-top: 20px;">
            <h3>إضافة طالب جديد 📝</h3>
            
            <div class="input-group">
                <label>اسم الطالب</label>
                <input type="text" id="studentName" placeholder="مثال: أحمد محمود">
            </div>
            <div class="input-group">
                <label>كود الطالب (الذي سيدخل به ولي الأمر)</label>
                <input type="text" id="studentCode" placeholder="مثال: 2001">
            </div>
            <div class="input-group">
                <label>كلمة المرور لحساب الطالب</label>
                <input type="password" id="studentPass" placeholder="أدخل كلمة المرور">
            </div>
            
            <button id="addStudentBtn">حفظ بيانات الطالب</button>
            <div id="addStudentMsg" style="color: green; margin-top: 15px; display: none; text-align: center; font-weight: bold;">تمت إضافة الطالب بنجاح!</div>
        </div>
    </div>

    <!-- كود الجافاسكريبت لفايربيز -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlmVnaD2CnBHJqF9ZpZ1EyJp-CvmqdSAQ",
            authDomain: "ragabweb-c243a.firebaseapp.com",
            projectId: "ragabweb-c243a",
            storageBucket: "ragabweb-c243a.firebasestorage.app",
            messagingSenderId: "995006462711",
            appId: "1:995006462711:web:175c189f34cc15088d31f2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginSection = document.getElementById('loginSection');
        const adminDashboard = document.getElementById('adminDashboard');

        loginBtn.addEventListener('click', () => {
            const code = document.getElementById('userCode').value;
            const password = document.getElementById('userPass').value;
            const email = code + "@ragabweb.com"; 

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // إخفاء تسجيل الدخول وإظهار لوحة التحكم
                    loginSection.style.display = 'none';
                    adminDashboard.style.display = 'block';
                    errorMessage.style.display = 'none';
                })
                .catch((error) => {
                    errorMessage.style.display = 'block';
                });
        });
    </script>
</body>
</html>
