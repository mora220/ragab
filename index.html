<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ محمد رجب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .admin-card {
            max-width: 800px;
            margin: auto;
        }
        h2 {
            color: #1a73e8;
            margin-bottom: 24px;
            text-align: center;
        }
        h3 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 5px;
            display: inline-block;
        }
        .dashboard-section {
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            background-color: #fafafa;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1557b0;
        }
        .error-msg {
            color: #d93025;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .success-msg {
            color: #188038;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول -->
    <div class="card login-card" id="loginSection">
        <h2>منصة الأستاذ محمد رجب 🎓</h2>
        <div class="input-group">
            <label for="userCode">كود المستخدم</label>
            <input type="text" id="userCode" placeholder="أدخل الكود الخاص بك (مثال: 1411)" required>
        </div>
        <div class="input-group">
            <label for="userPass">كلمة المرور</label>
            <input type="password" id="userPass" placeholder="أدخل كلمة المرور" required>
        </div>
        <button id="loginBtn">تسجيل الدخول</button>
        <div id="errorMessage" class="error-msg">كود المستخدم أو كلمة المرور غير صحيحة.</div>
    </div>

    <!-- لوحة تحكم المدير -->
    <div class="card admin-card" id="adminDashboard" style="display: none;">
        <h2>مرحباً بك يا أستاذ محمد 👨‍🏫 - لوحة الإدارة</h2>
        
        <!-- قسم إضافة طالب -->
        <div class="dashboard-section">
            <h3>إضافة طالب جديد 📝</h3>
            <div class="input-group">
                <label>اسم الطالب</label>
                <input type="text" id="studentName" placeholder="مثال: أحمد محمود">
            </div>
            <div class="input-group">
                <label>كود الطالب</label>
                <input type="text" id="studentCode" placeholder="مثال: 2001">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="studentPass" placeholder="أدخل كلمة المرور">
            </div>
            <button id="addStudentBtn">حفظ بيانات الطالب</button>
            <div id="addStudentMsg" class="success-msg">تمت إضافة الطالب بنجاح!</div>
        </div>

        <!-- قسم إضافة موعد حصة -->
        <div class="dashboard-section">
            <h3>إضافة موعد حصة 📅</h3>
            <div class="input-group">
                <label>كود الطالب</label>
                <input type="text" id="sessionStudentCode" placeholder="أدخل كود الطالب">
            </div>
            <div class="input-group">
                <label>تاريخ الحصة</label>
                <input type="date" id="sessionDate">
            </div>
            <div class="input-group">
                <label>وقت الحصة</label>
                <input type="time" id="sessionTime">
            </div>
            <button id="addSessionBtn">حفظ الموعد</button>
            <div id="addSessionMsg" class="success-msg">تم حفظ الموعد بنجاح!</div>
        </div>

        <!-- قسم تسجيل الحضور -->
        <div class="dashboard-section">
            <h3>تسجيل الحضور والغياب ✅❌</h3>
            <div class="input-group">
                <label>كود الطالب</label>
                <input type="text" id="attStudentCode" placeholder="أدخل كود الطالب">
            </div>
            <div class="input-group">
                <label>تاريخ الحصة</label>
                <input type="date" id="attDate">
            </div>
            <div class="input-group">
                <label>حالة الطالب</label>
                <select id="attStatus">
                    <option value="حاضر">حاضر</option>
                    <option value="غائب">غائب</option>
                </select>
            </div>
            <button id="addAttendanceBtn">حفظ السجل</button>
            <div id="addAttendanceMsg" class="success-msg">تم تسجيل الحالة بنجاح!</div>
        </div>

    </div>

    <!-- كود الجافاسكريبت لفايربيز -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlmVnaD2CnBHJqF9ZpZ1EyJp-CvmqdSAQ",
            authDomain: "ragabweb-c243a.firebaseapp.com",
            projectId: "ragabweb-c243a",
            storageBucket: "ragabweb-c243a.firebasestorage.app",
            messagingSenderId: "995006462711",
            appId: "1:995006462711:web:175c189f34cc15088d31f2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // واجهات المتصفح
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginSection = document.getElementById('loginSection');
        const adminDashboard = document.getElementById('adminDashboard');

        // 1. تسجيل الدخول
        loginBtn.addEventListener('click', () => {
            const code = document.getElementById('userCode').value;
            const password = document.getElementById('userPass').value;
            const email = code + "@ragabweb.com"; 

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    loginSection.style.display = 'none';
                    adminDashboard.style.display = 'block';
                    errorMessage.style.display = 'none';
                })
                .catch(() => {
                    errorMessage.style.display = 'block';
                });
        });

        // دالة مساعدة لإظهار رسائل النجاح
        function showSuccessMsg(elementId) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // 2. حفظ بيانات الطالب
        document.getElementById('addStudentBtn').addEventListener('click', async () => {
            const name = document.getElementById('studentName').value;
            const code = document.getElementById('studentCode').value;
            const pass = document.getElementById('studentPass').value;

            if(!name || !code || !pass) { alert("الرجاء تعبئة جميع الحقول!"); return; }

            try {
                await setDoc(doc(db, "students", code), {
                    name: name, code: code, password: pass, createdAt: new Date()
                });
                showSuccessMsg('addStudentMsg');
                document.getElementById('studentName').value = '';
                document.getElementById('studentCode').value = '';
                document.getElementById('studentPass').value = '';
            } catch (error) { alert("حدث خطأ في الحفظ."); console.log(error); }
        });

        // 3. حفظ موعد الحصة
        document.getElementById('addSessionBtn').addEventListener('click', async () => {
            const code = document.getElementById('sessionStudentCode').value;
            const date = document.getElementById('sessionDate').value;
            const time = document.getElementById('sessionTime').value;

            if(!code || !date || !time) { alert("الرجاء تعبئة جميع الحقول!"); return; }

            try {
                await addDoc(collection(db, "sessions"), {
                    studentCode: code, date: date, time: time, createdAt: new Date()
                });
                showSuccessMsg('addSessionMsg');
                document.getElementById('sessionStudentCode').value = '';
                document.getElementById('sessionDate').value = '';
                document.getElementById('sessionTime').value = '';
            } catch (error) { alert("حدث خطأ في الحفظ."); }
        });

        // 4. تسجيل الحضور والغياب
        document.getElementById('addAttendanceBtn').addEventListener('click', async () => {
            const code = document.getElementById('attStudentCode').value;
            const date = document.getElementById('attDate').value;
            const status = document.getElementById('attStatus').value;

            if(!code || !date) { alert("الرجاء إدخال كود الطالب والتاريخ!"); return; }

            try {
                await addDoc(collection(db, "attendance"), {
                    studentCode: code, date: date, status: status, createdAt: new Date()
                });
                showSuccessMsg('addAttendanceMsg');
                document.getElementById('attStudentCode').value = '';
                document.getElementById('attDate').value = '';
            } catch (error) { alert("حدث خطأ في الحفظ."); }
        });

    </script>
</body>
</html>
