<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ محمد رجب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #1a73e8;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        #errorMessage {
            color: #d93025;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>منصة الأستاذ محمد رجب 🎓</h2>
        <div class="input-group">
            <label for="userCode">كود المستخدم</label>
            <input type="text" id="userCode" placeholder="أدخل الكود الخاص بك " required>
        </div>
        <div class="input-group">
            <label for="userPass">كلمة المرور</label>
            <input type="password" id="userPass" placeholder="أدخل كلمة المرور" required>
        </div>
        <button id="loginBtn">تسجيل الدخول</button>
        <div id="errorMessage">كود المستخدم أو كلمة المرور غير صحيحة.</div>
    </div>

    <!-- سنقوم بوضع كود الجافاسكريبت و Firebase هنا لاحقاً -->
<script type="module">
  // استدعاء مكتبات فايربيز عبر روابط CDN لتعمل مباشرة في المتصفح
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // إعدادات مشروعك التي أرسلتها
  const firebaseConfig = {
    apiKey: "AIzaSyAlmVnaD2CnBHJqF9ZpZ1EyJp-CvmqdSAQ",
    authDomain: "ragabweb-c243a.firebaseapp.com",
    projectId: "ragabweb-c243a",
    storageBucket: "ragabweb-c243a.firebasestorage.app",
    messagingSenderId: "995006462711",
    appId: "1:995006462711:web:175c189f34cc15088d31f2"
  };

  // تهيئة فايربيز ونظام تسجيل الدخول
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBtn = document.getElementById('loginBtn');
  const errorMessage = document.getElementById('errorMessage');

  loginBtn.addEventListener('click', () => {
      const code = document.getElementById('userCode').value;
      const password = document.getElementById('userPass').value;

      // تحويل الكود إلى بريد إلكتروني وهمي
      const email = code + "@ragabweb.com"; 

      // إرسال الطلب لفايربيز
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // نجاح تسجيل الدخول
          alert("تم تسجيل الدخول بنجاح! أهلاً بك يا أستاذ محمد.");
          errorMessage.style.display = 'none';
          
          // الكود الخاص بإخفاء واجهة الدخول وإظهار لوحة التحكم سيكتب هنا
        })
        .catch((error) => {
          // فشل تسجيل الدخول
          errorMessage.style.display = 'block';
        });
  });
</script>
</body>
</html>
