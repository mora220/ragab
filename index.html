<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ محمد رجب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #1a73e8;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        #errorMessage {
            color: #d93025;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>منصة الأستاذ محمد رجب 🎓</h2>
        <div class="input-group">
            <label for="userCode">كود المستخدم</label>
            <input type="text" id="userCode" placeholder="أدخل الكود الخاص بك " required>
        </div>
        <div class="input-group">
            <label for="userPass">كلمة المرور</label>
            <input type="password" id="userPass" placeholder="أدخل كلمة المرور" required>
        </div>
        <button id="loginBtn">تسجيل الدخول</button>
        <div id="errorMessage">كود المستخدم أو كلمة المرور غير صحيحة.</div>
    </div>

    <!-- سنقوم بوضع كود الجافاسكريبت و Firebase هنا لاحقاً -->

</body>
</html>
